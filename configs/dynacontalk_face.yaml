# DynaConTalk - face model (FLAME expressions from speech + body shape + speaker).
#
# Speech-only conditioning with a network sized for the 400-dim expression target
# (512x4 trunk, no joint tokens), selected on val/FaceMSE:
#   effective batch 192 (96 per GPU x 1 GPU x 2 accumulation), AdamW lr 2e-4, wd 0,
#   bf16-mixed, grad clip 0.5, EMA 0.995 from step 1000, seed 42.
#   Cosine LR (eta_min 5e-6), evaluated per epoch: period 600 for epochs 0-32,
#   period 158 from epoch 33 on, decaying to 5e-6 by the last epoch (max_epochs 158).
#
# Conditioning network: `dgn=v2` (default) or `dgn=v1`, see configs/dgn/.

defaults:
- _self_
- dgn: v2
- hydra: default

data:
  _target_: src.data.beat_smplx_dataset.BeatSMPLXDataModule
  data_dir: ${oc.env:DYNACONTALK_DATA_DIR}
  batch_size: 96
  num_workers: 4
  pin_memory: true
  window_size: 64
  overlap_size: 8
  train_stride: 10
  eval_stride: 56
  motion_dim: 400
  wavelet_levels: 3
  target_group: face
  activity_dim: 1

model:
  _target_: src.models.light_final.LightMotionGeneration
  denoiser:
    _target_: src.models.nets.light_final.LightT2M
    motion_dim: ${data.motion_dim}
    max_motion_len: ${data.window_size}
    stage_dim: '512*4'
    num_groups: 16
    patch_size: 8
    target_group: face
    wavelet_levels: ${model.wavelet_levels}
    num_joints: 55
    use_joint_tokens: false
    band_decoder_hidden: 2048
    decoder_dropout: 0.0
    temporal_transformer_heads: 8
    temporal_transformer_ffn_ratio: 2.0
    temporal_transformer_dropout: 0.0
    proposal_scale_init: 1.0
    use_identity_token: true
    audio_conditioning_cfg:
      embed_dim: 128
      hidden_dim: 512
      context_dropout: 0.1
      film_dropout: 0.1
      rhythm_in_dim: 3
      mel_in_dim: 128
      semantic_in_dim: 1024
      clip_text_dim: 512
      activity_dim: ${data.activity_dim}
      shape_dim: 10
      num_speakers: 30
      use_trajectory_condition: false
      trajectory_cond_dim: 4
      use_keypose_condition: false
      keypose_cond_dim: ${data.motion_dim}
      num_train_timesteps: ${model.noise_scheduler.num_train_timesteps}
  noise_scheduler:
    _target_: diffusers.DDPMScheduler
    num_train_timesteps: 1000
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: linear
    variance_type: fixed_small
    clip_sample: false
    prediction_type: sample
  sample_scheduler:
    _target_: diffusers.UniPCMultistepScheduler
    num_train_timesteps: ${model.noise_scheduler.num_train_timesteps}
    beta_start: ${model.noise_scheduler.beta_start}
    beta_end: ${model.noise_scheduler.beta_end}
    beta_schedule: ${model.noise_scheduler.beta_schedule}
    solver_order: 2
    prediction_type: sample
    thresholding: false
    sample_max_value: 1.0
    predict_x0: true
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0002
    weight_decay: 0.0
  lr_scheduler:
    _target_: src.models.utils.lr_scheduler.CosineWarmupScheduler
    _partial_: true
    T_max: 600
    warmup: 0
    eta_min: 5.0e-06
    t_max_schedule: [[33, 158]]
  ema:
    use_ema: true
    ema_decay: 0.995
    ema_start: 1000
  guidance_scale: 4.0
  step_num: 10
  window_size: ${data.window_size}
  overlap_size: ${data.overlap_size}
  blend_frames: 4
  wavelet_levels: 3
  wavelet_name: db6
  target_group: face
  enable_fgd: false
  uncond_prob: 0.2
  partial_cond_prob: 0.4
  partial_drop_max_modalities: 4
  loss_weight_body: 2.0
  use_loss_3d: false
  use_loss_3d_vel: false
  lambda_3d: 0.2
  lambda_vel: 0.5
  smoothness_loss_weight: 0.0
  save_every_n_epochs: 100
  ckpt_path: ${paths.output_dir}/checkpoints

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch-{epoch:03d}
    monitor: val/FaceMSE
    mode: min
    save_top_k: 5
    save_last: true
    every_n_epochs: 1
    save_on_train_epoch_end: true
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 2
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step

logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 158
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  deterministic: false
  precision: bf16-mixed
  gradient_clip_val: 0.5
  accumulate_grad_batches: 2
  strategy: auto

paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}

extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: false

task_name: dynacontalk_face
tags: [dynacontalk, face]
seed: 42
ckpt_path: null
expected_effective_batch: 192
